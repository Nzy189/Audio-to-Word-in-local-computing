limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_requests:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 80;
    server_name 80.238.236.1;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://80.238.236.1$request_uri; }
}
server {
    listen 443 ssl;
    server_name 80.238.236.1;
    ssl_certificate /etc/letsencrypt/live/80.238.236.1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/80.238.236.1/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 301m;
    client_body_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    limit_conn connections 8;
    location /api/login {
        limit_req zone=login_requests burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        limit_req zone=api_requests burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
